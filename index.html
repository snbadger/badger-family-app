<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f3a5f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Badgers">
<title>Badger Family</title>
<link rel="manifest" href="manifest.json?v=2">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png?v=2">
<link rel="icon" href="icon-192.png?v=2" type="image/png">
<link rel="stylesheet" href="app.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
</head>
<body>
<div id="app">
  <header id="topbar" hidden>
    <div class="brand">🦡 <span>Badger Family</span></div>
    <button id="btn-refresh" class="icon-btn" title="Refresh">↻</button>
    <button id="btn-me" class="avatar-btn" title="Family & profile">🙂</button>
  </header>
  <main id="view"></main>
  <nav id="tabs" hidden>
    <button data-tab="home"><span>🏠</span>Home</button>
    <button data-tab="chores"><span>✅</span>Chores</button>
    <button data-tab="school"><span>📚</span>School</button>
    <button data-tab="calendar"><span>📅</span>Plans</button>
    <button data-tab="projects"><span>🔨</span>Projects</button>
    <button data-tab="goals"><span>🎯</span>Goals</button>
  </nav>
  <div id="modal" hidden><div class="sheet"><div id="modal-body"></div></div></div>
  <div id="toast" hidden></div>
</div>
<script src="app.js"></script>
</body>
</html>
